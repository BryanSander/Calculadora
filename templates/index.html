<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Calculadora</title>

    <style>

        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        input, select, button {
            padding: 10px;
            margin: 5px;
        }

        button {
            cursor: pointer;
        }

        #resultado {
            margin-top: 20px;
            font-size: 20px;
        }

    </style>

</head>


<body>

    <h1>Calculadora</h1>


    <input
        type="number"
        id="numero1"
        placeholder="Primeiro número"
    >


    <select id="operacao">

        <option value="+">+</option>

        <option value="-">-</option>

        <option value="*">*</option>

        <option value="/">/</option>

    </select>


    <input
        type="number"
        id="numero2"
        placeholder="Segundo número"
    >


    <br>


    <button onclick="calcular()">
        Calcular
    </button>


    <div id="resultado"></div>


    <script>

        async function calcular() {

            let numero1 = Number(
                document.getElementById("numero1").value
            );

            let numero2 = Number(
                document.getElementById("numero2").value
            );

            let operacao =
                document.getElementById("operacao").value;


            let resposta = await fetch("/calcular", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    numero1: numero1,
                    numero2: numero2,
                    operacao: operacao

                })

            });


            let dados = await resposta.json();


            document.getElementById("resultado").innerText =
                "Resultado: " + dados.resultado;

        }

    </script>

</body>

</html>
